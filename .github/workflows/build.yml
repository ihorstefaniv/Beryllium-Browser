# Builds Beryll on GitHub's Windows runner from source (no private keys here).
# When SignPath Foundation approves the project and the secrets below exist, Beryll.exe is also
# Authenticode-signed by SignPath. See docs/SIGNING.md.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File build.ps1

      - name: Upload unsigned build
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: Beryll-unsigned
          path: dist/Beryll/
          if-no-files-found: error

      - name: Sign with SignPath
        if: ${{ startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: Beryllium-Browser
          signing-policy-slug: release-signing
          artifact-configuration-slug: initial
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Upload signed build
        if: ${{ startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Beryll-signed
          path: signed/
